<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chez Laziz — عند لعزيز · Pâtisserie à Kairouan spécialisée dans le makroudh kairouanais authentique, fait main chaque jour. Dattes, fruits secs, pistache, fraise." />
    <link rel="canonical" href="https://chezlaziz.com/" />
    <title>Chez Laziz — عند لعزيز · Makroudh de Kairouan</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2e2a27" />

    <!-- Open Graph / réseaux sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chez Laziz" />
    <meta property="og:title" content="Chez Laziz — عند لعزيز · Makroudh de Kairouan" />
    <meta property="og:description" content="Pâtisserie artisanale à Kairouan — makroudh kairouanais authentique, fait main chaque jour. Dattes, fruits secs, pistache, fraise." />
    <meta property="og:image" content="https://chezlaziz.com/images/hero.jpg" />
    <meta property="og:url" content="https://chezlaziz.com/" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chez Laziz — عند لعزيز · Makroudh de Kairouan" />
    <meta name="twitter:description" content="Pâtisserie artisanale à Kairouan — makroudh kairouanais authentique, fait main chaque jour." />
    <meta name="twitter:image" content="https://chezlaziz.com/images/hero.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Chargement non bloquant : le texte s'affiche avec la police de repli
         (font-display=swap) sans attendre la réponse de Google Fonts. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Deux liens plutôt que imagesrcset/imagesizes : le "media" simple
         évite un double téléchargement (préchargement et <img> qui ne
         s'accordent pas toujours sur la résolution avec un descripteur "w"). -->
    <link rel="preload" as="image" href="/images/hero-mobile.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero.webp" media="(min-width: 768px)" fetchpriority="high" />

    <!-- Données structurées : identité réelle du commerce uniquement.
         "Bakery" (sous-type de LocalBusiness) couvre déjà le rôle d'une
         fiche "Organization" générique, en plus spécifique — pas besoin
         des deux pour la même entité. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Bakery",
        "@id": "https://chezlaziz.com/#business",
        "name": "Chez Laziz",
        "alternateName": "عند لعزيز",
        "image": "https://chezlaziz.com/images/hero.jpg",
        "url": "https://chezlaziz.com/",
        "telephone": "+21623691039",
        "email": "contact@chezlaziz.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kairouan",
          "addressCountry": "TN"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"
          ],
          "opens": "07:00",
          "closes": "00:00"
        },
        "servesCuisine": "Pâtisserie tunisienne",
        "priceRange": "8-40 TND",
        "sameAs": [
          "https://www.instagram.com/chezlaziz",
          "https://www.facebook.com/profile.php?id=61573444418563",
          "https://www.google.com/maps/place/Chez+laziz+%D8%A7%D9%84%D9%82%D9%8A%D8%B1%D9%88%D8%A7%D9%86/data=!4m2!3m1!1s0x12fdcf004a648cdf:0xacd6eabb156c7203"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Chez Laziz",
        "url": "https://chezlaziz.com/",
        "inLanguage": ["fr", "ar"],
        "publisher": { "@id": "https://chezlaziz.com/#business" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
